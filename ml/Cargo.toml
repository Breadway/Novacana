[package]
name = "novacana-ml"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "novacana-ml"
path = "src/main.rs"

[[bin]]
name = "novacana-ml-v6"
path = "src/main_v6.rs"

[dependencies]
novacana-engine = { path = "../engine" }
ndarray = { version = "0.15", features = ["blas"] }
blas-src = { version = "0.10", default-features = false, features = ["openblas"] }
openblas-src = { version = "0.10", features = ["system"] }
ndarray-rand = "0.14"
rand = "0.8"
rayon = "1"
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1"
