[package]
name = "novacana-ml"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "novacana-ml"
path = "src/main.rs"

[dependencies]
novacana-engine = { path = "../engine" }
# Pure-Rust matrixmultiply backend - deliberately NOT the ndarray "blas"
# feature: system OpenBLAS's per-calling-thread buffer table overflows under
# rayon ("precompiled NUM_THREADS exceeded") → heap corruption / SIGSEGV.
ndarray = "0.15"
ndarray-rand = "0.14"
rand = "0.8"
rayon = "1"
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1"
burn = { version = "0.21", default-features = false, features = ["autodiff"] }
burn-ndarray = { version = "0.21" }

[features]
default = ["gpu"]
gpu = ["dep:burn-wgpu"]

[dependencies.burn-wgpu]
version = "0.21"
optional = true
