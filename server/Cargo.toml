[package]
name = "novacana-server"
version = "0.1.0"
edition = "2021"

[dependencies]
novacana-engine = { path = "../engine" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
argon2 = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
