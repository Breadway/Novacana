[package]
name = "novacana-ml7"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "novacana-ml7"
path = "src/main.rs"

[dependencies]
novacana-engine = { path = "../engine" }
rand = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
burn = { version = "0.21", default-features = false, features = ["autodiff", "std"] }
burn-ndarray = { version = "0.21" }

[features]
default = []
tch = ["dep:burn-tch"]

[dependencies.burn-tch]
version = "0.21"
optional = true

[build-dependencies]
